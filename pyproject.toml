[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-utils"
version = "0.1.0"
description = "Basic functions for manipulating strings and text."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["text_utils*"]
